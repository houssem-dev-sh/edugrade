spring.application.name=student-management
spring.datasource.url=jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:studentdb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# Server configuration :
server.address=0.0.0.0
server.port=8089
server.servlet.context-path=/student
sonar.projectKey=jenkins
sonar.host.url=http://localhost:9000
sonar.token=${SONAR_TOKEN:}
sonar.java.binaries=target/classes
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# ===== EMAIL =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ===== JWT =====
jwt.secret=${JWT_SECRET:StudentOpsDefaultSecretKeyForDevOnly2024}
jwt.expiration=86400000

# ===== OTP =====
otp.expiration=300
spring.profiles.active=dev
