apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: edugrade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edugrade
      component: backend
  template:
    metadata:
      labels:
        app: edugrade
        component: backend
    spec:
      containers:
        - name: backend
          image: docker.io/houssem26102001/student-backend:51
          ports:
            - name: http
              containerPort: 8080
          # ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_TWO_FACTOR, MAIL_USERNAME, MAIL_PASSWORD, JWT_SECRET.
          # Created by hand on the cluster (kept out of Git), like mariadb-secret.
          envFrom:
            - secretRef:
                name: backend-secret
                optional: true
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://mariadb:3306/edugrade?useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: edugrade
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi