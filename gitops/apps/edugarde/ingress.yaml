apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edugrade
  namespace: edugrade
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /student
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80